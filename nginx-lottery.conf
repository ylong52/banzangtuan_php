# Nginx 配置 - Vue3 SPA 部署到 /lottery/ 路径
# 将此配置添加到你的 nginx server 块中

# Vue 应用 - /lottery/ 路径
location /lottery/ {
    # 指向 dist 目录的内容（根据实际路径修改）
    alias /var/www/html/lottery/;
    
    # 关键配置：所有路由都回退到 index.html（支持 Vue Router）
    try_files $uri $uri/ /lottery/index.html;
    
    # 确保 index.html 不被缓存
    location = /lottery/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # JavaScript 文件 - 确保正确的 MIME 类型
    location ~* /lottery/assets/.*\.(js|mjs)$ {
        alias /var/www/html/lottery/assets/;
        add_header Content-Type "application/javascript; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # CSS 文件
    location ~* /lottery/assets/.*\.css$ {
        alias /var/www/html/lottery/assets/;
        add_header Content-Type "text/css; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 图片和其他静态资源
    location ~* /lottery/assets/.*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /var/www/html/lottery/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

